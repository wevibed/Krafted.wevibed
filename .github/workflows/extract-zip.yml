name: Replace Project From ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find uploaded ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Remove old project files
        shell: bash
        run: |
          echo "Removing old project..."

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "*.zip" \
            -exec rm -rf {} +

          echo "Old project removed."

      - name: Extract new project
        shell: bash
        run: |
          unzip -o "$ZIP_FILE" -d .

          echo "New project extracted."

      - name: Remove uploaded ZIP
        shell: bash
        run: |
          rm -f "$ZIP_FILE"

      - name: Show final structure
        shell: bash
        run: |
          echo "Final repository:"
          find . -maxdepth 2 -type f | sort

      - name: Commit replacement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit -m "Replace project with Krafted Suits ZW website" || echo "Nothing to commit"

          git push
